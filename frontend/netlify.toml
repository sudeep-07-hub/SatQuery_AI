[build]
  command = "npm run build"
  publish = "dist"

# SPA routing: /assistant and other deep links are served by index.html.
# Non-forced (status 200) rules only apply when no static file matches, so assets are unaffected.
# Missing hashed build assets must 404 (not return index.html with a JS MIME error)
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
